; ==============================================================================
; PlatformIO Project Configuration — ESP32 GM67 Barcode Scanner Firmware
; v2.0 — WiFi + HTTP REST Integration
; ==============================================================================

[platformio]
default_envs = esp32dev

; ==============================================================================
; Shared settings
; ==============================================================================
[common]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---- Libraries ----
; WiFi and HTTPClient are bundled with the ESP32 Arduino core — no extra libs.
; ArduinoJson is listed but not required (we use minimal manual parsing).
; Uncomment if you want full JSON deserialization in HttpClient.cpp.
lib_deps =
    ; bblanchon/ArduinoJson @ ^7.0.0

; ---- Build flags ----
; -std=gnu++17           → enables structured bindings, constexpr if, etc.
; -DCORE_DEBUG_LEVEL=3   → ESP-IDF info-level logging (set 0 for production)
; -DARDUINO_LOOP_STACK_SIZE → increase loop task stack for WiFi + HTTP calls
;
; TO SET WiFi CREDENTIALS WITHOUT COMMITTING THEM:
;   Add to your local platformio.ini (git-ignored):
;     build_flags = ${common.build_flags}
;                   -DWIFI_SSID='"YourSSID"'
;                   -DWIFI_PASSWORD='"YourPass"'
;                   -DAPI_BASE_URL='"http://192.168.1.x:8000"'
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wall
    -Wextra

; ---- Serial monitor ----
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize, time

; ---- Upload ----
upload_speed = 921600

; ---- Extra include paths ----
lib_extra_dirs = ../shared

; ==============================================================================
; Development — full debug, verbose logs
; ==============================================================================
[env:esp32dev]
extends     = common
build_flags =
    ${common.build_flags}
    -DDEBUG_MODE=1
    -DLOG_LEVEL=4

; ==============================================================================
; Production — minimal logs, size optimised
; ==============================================================================
[env:esp32prod]
extends     = common
build_flags =
    ${common.build_flags}
    -DDEBUG_MODE=0
    -DLOG_LEVEL=1
    -Os
    ; Set real credentials via CI/CD secrets — never hardcode in production env.
    ; -DWIFI_SSID='"ProdSSID"'
    ; -DWIFI_PASSWORD='"ProdPass"'
    ; -DAPI_BASE_URL='"http://192.168.1.x:8000"'
    ; -DIOT_DEVICE_SECRET='"<strong-random-secret>"'
