# Nginx configuration for ERSIS React SPA + API reverse proxy
# This file is copied into the frontend container at build time.
#
# Why this is needed:
#   1. React Router uses client-side routing. Without the `try_files`
#      directive, a hard refresh on /dashboard would return a 404.
#   2. In the Docker network, /api/* requests must be forwarded to the
#      `backend` service (container name) on port 8000. This mirrors
#      what Vite's dev-server proxy does locally.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression for faster page loads ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── API reverse proxy ──
    # Forwards /api/* → http://backend:8000/api/*
    # "backend" is the Docker Compose service name, Docker DNS resolves it.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (used by scanner/MQTT endpoints)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── React SPA fallback ──
    # Serve index.html for all routes so React Router can handle navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
