# ============================================================
# Mosquitto MQTT Broker Configuration
# Used by: IoT barcode scanners (ESP32), backend scanner router
# ============================================================

# Allow anonymous connections (change to "false" and add
# password_file for production hardening)
allow_anonymous true

# Standard MQTT port
listener 1883

# WebSocket listener (useful for browser-based MQTT clients)
listener 9001
protocol websockets

# Persistence: retain messages across broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
